name: tradesentinel
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradesentinel
      POSTGRES_USER: tradesentinel
      POSTGRES_PASSWORD: tradesentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      TRADESENTINEL_ENVIRONMENT: development
      TRADESENTINEL_DATABASE_URL: postgresql+asyncpg://tradesentinel:tradesentinel@postgres:5432/tradesentinel
      TRADESENTINEL_REDIS_URL: redis://redis:6379/0
      TRADESENTINEL_PERSISTENCE_BACKEND: postgres
      TRADESENTINEL_EVENT_BACKEND: redis
      TRADESENTINEL_CACHE_BACKEND: redis
      TRADESENTINEL_LLM_PROVIDERS: ${TRADESENTINEL_LLM_PROVIDERS:-[]}
      TRADESENTINEL_OPENAI_API_KEY: ${TRADESENTINEL_OPENAI_API_KEY:-}
      TRADESENTINEL_ANTHROPIC_API_KEY: ${TRADESENTINEL_ANTHROPIC_API_KEY:-}
      TRADESENTINEL_OPENAI_MODEL: ${TRADESENTINEL_OPENAI_MODEL:-gpt-5-mini}
      TRADESENTINEL_ANTHROPIC_MODEL: ${TRADESENTINEL_ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "tradesentinel.worker"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
