[project]
name = "tradesentinel"
version = "0.1.0"
description = "TradeSentinel modular platform foundation"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.66,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "openai>=1.99,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.1,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = true

[tool.uv.sources]
tradesentinel = { workspace = true }

[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src"

[tool.importlinter]
root_packages = ["tradesentinel"]

[[tool.importlinter.contracts]]
name = "Platform remains independent of feature modules"
type = "forbidden"
source_modules = ["tradesentinel.platform"]
forbidden_modules = ["tradesentinel.modules"]

[[tool.importlinter.contracts]]
name = "Platform remains independent of provider domain contracts"
type = "forbidden"
source_modules = ["tradesentinel.platform"]
forbidden_modules = ["tradesentinel.providers"]

[[tool.importlinter.contracts]]
name = "Provider abstractions remain independent of feature modules"
type = "forbidden"
source_modules = ["tradesentinel.providers"]
forbidden_modules = ["tradesentinel.modules"]
